<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token launch radar</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <h1>Token launch radar</h1>
        <p class="sub">Protocols that record no token, ranked by the value a token would have if their record stayed as it is.</p>
      </div>
    </div>
    <nav class="tabs" aria-label="Views" id="tabs"></nav>
  </header>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <main id="app">
    <p class="empty">Loading the radar. If this stays, data.js did not load beside the dashboard folder.</p>
  </main>
  <footer class="foot" id="foot"></footer>
  <script src="../data.js"></script>
  <script src="app.js"></script>
</body>
</html>
